[project]
name = "sarils-backend"
version = "0.1.0"
description = "사릴스(SARILS) — 소상공인 숏폼 제작 서비스 백엔드"
authors = [{ name = "FLY AI 열정 2조" }]
readme = "README.md"
requires-python = ">=3.12,<4.0"

dependencies = [
    "fastapi (>=0.115.0,<0.116.0)",
    "uvicorn[standard] (>=0.32.0,<0.33.0)",
    "sqlalchemy (>=2.0.36,<3.0.0)",
    "alembic (>=1.14.0,<2.0.0)",
    "pymysql (>=1.1.1,<2.0.0)",
    "cryptography (>=44.0.0,<45.0.0)",
    "pydantic-settings (>=2.6.0,<3.0.0)",
    "python-multipart (>=0.0.20,<0.0.21)",
    "pyjwt (>=2.10.0,<3.0.0)",
    "bcrypt (>=4.2.0,<5.0.0)",
    "email-validator (>=2.2.0,<3.0.0)",
    "httpx (>=0.28.0,<0.29.0)",
    "boto3 (>=1.43.78,<2.0.0)",
]

[tool.poetry.group.dev.dependencies]
ruff = "^0.8.0"
pytest = "^8.3.0"
httpx = "^0.28.0"

# 가게 등록 시 카카오맵에서 대표 메뉴를 자동으로 가져오는 백그라운드 기능
# (app/services/menu_crawl.py, scripts/crawl_kakao_menu.py) 전용. API 프로세스는
# 이 그룹 없이도 뜬다 — 없으면 크롤링만 조용히 건너뛴다(menu_crawl.py의
# FileNotFoundError 처리 참고). 배포 서버에서만 별도로 설치한다:
#   poetry install --without dev --with crawler
# Chrome 브라우저 자체는 poetry가 설치하지 못한다 — 서버에 따로 설치해야 한다
# (deploy/README.md 참고).
[tool.poetry.group.crawler]
optional = true

[tool.poetry.group.crawler.dependencies]
selenium = "^4.27.0"
webdriver-manager = "^4.0.2"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false

# ---------------------------------------------------------------- Ruff
[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [".venv", "migrations/versions"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle 오류
    "W",   # pycodestyle 경고
    "F",   # pyflakes (미사용 변수/임포트)
    "I",   # isort (임포트 정렬)
    "B",   # flake8-bugbear (버그 유발 패턴)
    "UP",  # pyupgrade (구식 문법)
]
ignore = [
    "B008",  # FastAPI의 Depends()를 기본값으로 쓰는 패턴 때문에 필요
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
