[project]
name = "sarils-backend"
version = "0.1.0"
description = "사릴스(SARILS) — 소상공인 숏폼 제작 서비스 백엔드"
authors = [{ name = "FLY AI 열정 2조" }]
readme = "README.md"
requires-python = ">=3.12,<4.0"

dependencies = [
    "fastapi (>=0.115.0,<0.116.0)",
    "uvicorn[standard] (>=0.32.0,<0.33.0)",
    "sqlalchemy (>=2.0.36,<3.0.0)",
    "alembic (>=1.14.0,<2.0.0)",
    "pymysql (>=1.1.1,<2.0.0)",
    "cryptography (>=44.0.0,<45.0.0)",
    "pydantic-settings (>=2.6.0,<3.0.0)",
    "python-multipart (>=0.0.20,<0.0.21)",
    "pyjwt (>=2.10.0,<3.0.0)",
    "bcrypt (>=4.2.0,<5.0.0)",
    "email-validator (>=2.2.0,<3.0.0)",
]

[tool.poetry.group.dev.dependencies]
ruff = "^0.8.0"
pytest = "^8.3.0"
httpx = "^0.28.0"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false

# ---------------------------------------------------------------- Ruff
[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [".venv", "migrations/versions"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle 오류
    "W",   # pycodestyle 경고
    "F",   # pyflakes (미사용 변수/임포트)
    "I",   # isort (임포트 정렬)
    "B",   # flake8-bugbear (버그 유발 패턴)
    "UP",  # pyupgrade (구식 문법)
]
ignore = [
    "B008",  # FastAPI의 Depends()를 기본값으로 쓰는 패턴 때문에 필요
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
