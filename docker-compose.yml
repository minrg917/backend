services:
  mysql:
    image: mysql:8.0
    container_name: sarils-mysql
    restart: unless-stopped
    ports:
      # 호스트 포트는 .env 의 DB_PORT 를 따른다 (3306이 이미 쓰이면 다른 값으로).
      - "${DB_PORT:-3306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: sarils
      MYSQL_USER: sarils
      MYSQL_PASSWORD: sarils
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-psarils"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysql-data:
