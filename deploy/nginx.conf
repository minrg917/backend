# nginx 리버스 프록시 (네이티브 설치 기준).
#
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/sarils
#   sudo ln -sf /etc/nginx/sites-available/sarils /etc/nginx/sites-enabled/sarils
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# 아래 sarils.example.com 을 실제 도메인으로 바꾼다.
# HTTPS는 certbot이 이 파일을 자동으로 고쳐준다(아래 deploy/README.md 4절 참고).

server {
    listen 80;
    server_name sarils.example.com;

    # 촬영본은 200MB까지 올라온다(MAX_VIDEO_UPLOAD_SIZE_MB).
    # nginx 기본값이 1MB라 그대로 두면 정상 촬영분이 413으로 막힌다.
    client_max_body_size 210M;

    # 영상 업로드는 오래 걸린다 — 기본 60초면 큰 파일이 끊긴다.
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # uvicorn이 --proxy-headers로 이 값을 읽어 https를 인식한다.
        # 없으면 서버가 만든 URL이 http로 나가 OAuth 리다이렉트가 깨진다.
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
