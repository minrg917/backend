# 배포 전 아래 sarils.example.com 을 실제 도메인으로 바꾼다(3곳).

upstream sarils_api {
    server api:8000;
}

server {
    listen 80;
    server_name sarils.example.com;

    # 인증서 발급·갱신용 경로는 HTTPS로 넘기지 않는다.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name sarils.example.com;

    ssl_certificate     /etc/letsencrypt/live/sarils.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sarils.example.com/privkey.pem;

    # 촬영본은 200MB까지 올라온다(MAX_VIDEO_UPLOAD_SIZE_MB). 기본값 1MB면 413이 난다.
    client_max_body_size 210M;

    # 영상 업로드는 오래 걸린다 — 기본 60초면 큰 파일이 끊긴다.
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    location / {
        proxy_pass http://sarils_api;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
