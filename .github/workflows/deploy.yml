name: deploy

# main에 push될 때만 배포한다 — develop이 아니다. feature/fix는 develop으로
# 계속 쌓이고, develop -> main PR을 머지하는 "배포 시점"에만 실서버가 갱신된다
# (docs/CLAUDE.md 2026-08-26 워크플로 정정 참고). develop 트리거로 걸면 PR
# 하나 머지될 때마다 즉시 배포돼 "모아서 배포"가 무의미해진다.
on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/backend
            # 서버의 로컬 체크아웃이 어느 브랜치를 보고 있었든 상관없이 항상
            # main을 명시적으로 가져온다. 이 레포의 GitHub 기본 브랜치가
            # develop이라, 순진한 `git pull`은 체크아웃된 브랜치(=develop)를
            # 당겨서 트리거(main push)와 실제 배포 코드가 어긋날 수 있었다
            # (2026-08-26 첫 자동배포 로그에서 발견 — 그날은 두 브랜치 내용이
            # 우연히 같아서 드러나지 않았다).
            git fetch origin main
            git checkout main
            git reset --hard origin/main
            .venv/bin/poetry install --without dev
            sudo install -m 0644 deploy/sarils-trend-sync.service /etc/systemd/system/
            sudo install -m 0644 deploy/sarils-trend-sync.timer /etc/systemd/system/
            sudo systemctl daemon-reload
            sudo systemctl enable --now sarils-trend-sync.timer
            sudo systemctl restart sarils-api
